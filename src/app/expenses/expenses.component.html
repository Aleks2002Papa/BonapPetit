<div class="top-bar">
  <button class="btn add" (click)="addExpense()">
    <i class="fas fa-plus"></i> Shto Gjendje
  </button>
</div>
<div class="search-box">
  <input type="text" placeholder="Kërko..." [value]="searchText()"
    (input)="searchText.set($any($event.target).value)" />
</div>

<table class="table">
  <thead>
    <tr>
      <th (click)="sortBy('id')">ID</th>
      <th (click)="sortBy('quantity')">Emri</th>
      <th>Pershkrimi</th>
      <th>Shuma</th>
      <th>Data</th>
      <th>Veprimet</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let expanse of filteredExpanses()">
      <td>{{ expanse.id }}</td>
      <td>{{ expanse.name }}</td>
      <td>{{ expanse.description | slice:0:50 }}{{ expanse.description.length > 50 ? '...' : '' }}</td>
      <td>{{ expanse.amount }}</td>
      <td>{{ expanse.date.date | date: 'mediumDate' }}</td>
      <td class="actions">
        <button class="btn view" matTooltip="Shiko shitjen" (click)="viewExpense(expanse)">
          <i class="fas fa-eye"></i>
        </button>
        <button class="btn edit" matTooltip="Modifiko shitjen" (click)="editExpense(expanse)">
          <i class="fas fa-edit"></i>
        </button>
        <button class="btn delete" matTooltip="Fshi shitjen" (click)="confirmDeleteExpense(expanse)">
          <i class="fas fa-trash"></i>
        </button>
      </td>
    </tr>
  </tbody>
</table>
