<div class="top-bar">
  <button class="btn add" (click)="addStock()">
    <i class="fas fa-plus"></i> Shto Gjendje
  </button>
</div>
<div class="search-box">
  <input type="text" placeholder="Kërko..." [value]="searchText()"
    (input)="searchText.set($any($event.target).value)" />
</div>

<table class="table">
  <thead>
    <tr>
      <th (click)="sortBy('id')">ID</th>
      <th (click)="sortBy('quantity')">Sasia</th>
      <th>Data</th>
      <th>Shitje</th>
      <th>Veprimet</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let sale of filteredStock()">
      <td>{{ sale.id }}</td>
      <td>{{ sale.quantity }}</td>
      <td>{{ sale.date.date | date: 'mediumDate' }}</td>
      <td>{{ sale.sales }}</td>
      <td class="actions">
        <button class="btn view" matTooltip="Shiko shitjen" (click)="viewStock(sale)">
          <i class="fas fa-eye"></i>
        </button>
        <button class="btn edit" matTooltip="Modifiko shitjen" (click)="editStock(sale)">
          <i class="fas fa-edit"></i>
        </button>
        <button class="btn delete" matTooltip="Fshi shitjen" (click)="deleteStock(sale)">
          <i class="fas fa-trash"></i>
        </button>
      </td>
    </tr>
  </tbody>
</table>
